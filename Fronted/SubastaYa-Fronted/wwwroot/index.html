<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubastaYa - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/catalogo.css" />
    <link rel="stylesheet" href="/css/billetera.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- // QUÉ HACE: presenta navegación, marca y cuenta en una cabecera horizontal. -->
      <!-- // POR QUÉ: el catálogo necesita el ancho que antes ocupaba la barra lateral. -->
      <header class="market-header">
        <div class="market-header__top">
          <a class="market-logo" href="/index.html" aria-label="Ir al inicio">SubastaYa</a>
          <nav class="market-nav" aria-label="Navegación principal">
            <a href="/index.html" class="active">Explorar</a>
            <a href="/pages/crear-subasta.html">Crear subasta</a>
            <a href="/pages/billetera.html">Billetera</a>
            <a href="/pages/panel.html">Mis actividades</a>
          </nav>
          <!-- // QUÉ HACE: permite cambiar el tema sin salir de la página. -->
          <!-- // POR QUÉ: la preferencia visual pertenece a la navegación global. -->
          <div class="header-controls">
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
              <span class="theme-toggle__icon" aria-hidden="true"></span>
              <span class="theme-toggle__label">Oscuro</span>
            </button>
            <div class="auth-actions" aria-label="Acciones de cuenta"></div>
          </div>
        </div>
        <div class="market-header__bottom">
          <input id="buscadorGeneral" class="search-input" placeholder="Buscar por título, artículo o descripción..." aria-label="Buscar subastas" />
        </div>
      </header>

      <main class="main-content">
        <!-- Catálogo visible por defecto -->
        <section id="catalogo-view" class="container py-4">
          <div id="featuredContainer" class="mb-4"></div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold m-0">Todas las Subastas</h3>
            <button id="btnLimpiar" class="btn btn-outline-secondary btn-sm">Limpiar Filtros</button>
          </div>
          <div class="catalog-layout">
            <aside class="catalog-filters" aria-labelledby="catalogFiltersTitle">
              <div class="catalog-filters__heading">
                <h4 id="catalogFiltersTitle">Filtrar y ordenar</h4>
                <span>Encontrá publicaciones según lo que buscás</span>
              </div>
              <div class="catalog-filters__groups">
              <details class="filter-accordion" open>
                <summary>Estado</summary>
                <div class="filter-accordion__content">
                  <label for="filtroEstado">Disponibilidad de la subasta</label>
                  <select class="form-select" id="filtroEstado">
                    <option value="todos">Todas las subastas</option>
                    <option value="1">Activas (en curso)</option>
                    <option value="0">Próximas</option>
                    <option value="2">Finalizadas</option>
                  </select>
                </div>
              </details>

              <details class="filter-accordion">
                <summary>Categoría</summary>
                <div class="filter-accordion__content">
                  <label for="filtroCategoria">Tipo de publicación</label>
                  <select class="form-select" id="filtroCategoria">
                    <option value="todas">Todas las categorías</option>
                    <option value="1">Tecnología</option>
                    <option value="2">Coleccionables</option>
                    <option value="3">Arte</option>
                    <option value="4">Vehículos</option>
                  </select>
                </div>
              </details>

              <details class="filter-accordion">
                <summary>Rango de precio</summary>
                <div class="filter-accordion__content">
                  <label for="precioMin">Precio de la puja actual</label>
                  <div class="filter-price-range">
                    <input type="number" class="form-control" id="precioMin" placeholder="Mínimo" min="0" inputmode="decimal">
                    <span aria-hidden="true">a</span>
                    <input type="number" class="form-control" id="precioMax" placeholder="Máximo" min="0" inputmode="decimal">
                  </div>
                </div>
              </details>

              <details class="filter-accordion">
                <summary>Ordenar resultados</summary>
                <div class="filter-accordion__content">
                  <span class="filter-accordion__label">Mostrá primero</span>
                  <div class="sort-pills" role="group" aria-label="Ordenar resultados">
                    <button type="button" class="sort-pill active" data-sort="menor-tiempo">Cierra pronto</button>
                    <button type="button" class="sort-pill" data-sort="mayor-tiempo">Mayor duración</button>
                    <button type="button" class="sort-pill" data-sort="menor-puja">Menor puja</button>
                    <button type="button" class="sort-pill" data-sort="mayor-puja">Mayor puja</button>
                  </div>
                </div>
              </details>
              </div>
            </aside>
            <div id="gridSubastas" class="row catalog-layout__results"></div>
          </div>
        </section>

     
       
      </main>

      <footer class="market-footer">
        <p>© 2026 SubastaYa · Plataforma de Subastas en Tiempo Real</p>
      </footer>
    </div>

    <div id="toastContainer" class="toast-container-fixed"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@7.0.5/dist/browser/signalr.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/catalogo.js?v=20260912-3"></script>
  </body>
</html>
