<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubastaYa - Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/catalogo.css" />
    <link rel="stylesheet" href="/css/billetera.css" />
    <style>
      body { font-family: 'Inter', sans-serif; background:#0c0e16; color:#e8e6ff; }
      .app-container{display:flex;min-height:100vh}
      .sidebar{width:240px;padding:20px;background:linear-gradient(180deg,#080814,#0b0d19);border-right:1px solid rgba(255,255,255,0.03)}
      .main-content{flex:1;padding:28px}
      .search-input{width:100%;padding:10px 14px;border-radius:8px;background:#0f1220;border:1px solid rgba(255,255,255,0.04);color:#fff}
      #salaOferta{font-size:2rem;color:#ffd166}
    </style>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-brand mb-4"><h2>SubastaYa</h2></div>
        <nav class="sidebar-nav d-flex flex-column">
          <a href="#" class="active text-decoration-none mb-3">Explorar Catálogo</a>
          <a href="/crear-subasta.html" class="text-decoration-none mb-3">Crear Subasta</a>
          <a href="/billetera.html" class="text-decoration-none mb-3">Billetera Virtual</a>
          <a href="/panel.html" class="text-decoration-none mb-3">Mis Actividades</a>
        </nav>
        <div class="sidebar-bottom mt-auto">
          <!-- Espacio dinámico: auth.js rellenará aquí 'Iniciar Sesión' o 'Conectado como' -->
          <div class="sidebar-bottom-placeholder"></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="mb-4">
          <input id="buscadorGeneral" class="search-input" placeholder="Buscar por título, artículo o descripción..." />
        </header>

        <!-- Catálogo visible por defecto -->
        <section id="catalogo-view" class="container py-4">
          <div id="featuredContainer" class="mb-4"></div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold m-0">Todas las Subastas</h3>
            <button id="btnLimpiar" class="btn btn-outline-secondary btn-sm">Limpiar Filtros</button>
          </div>
          <div id="gridSubastas" class="row"></div>
        </section>

        <!-- Sala oculta por defecto -->
        <section id="sala-view" class="container py-4 d-none">
          <a href="#" id="btnVolverCatalogo" class="btn btn-link mb-3">← Volver al catálogo</a>
          <div class="row">
            <div class="col-12 col-md-6 mb-3"><img id="salaImagen" src="" class="img-fluid rounded" alt="Imagen" /></div>
            <div class="col-12 col-md-6">
              <h2 id="salaTitulo"></h2>
              <p id="salaDescripcion" class="text-muted"></p>
              <div class="mb-3">Precio actual: <strong id="salaOferta">$0</strong></div>
              <div class="mb-3 input-group">
                <input id="montoPuja" type="number" class="form-control" placeholder="Monto" min="0" step="0.01" />
                <button id="btnOfertar" class="btn btn-primary">Ofertar</button>
              </div>
              <h5>Historial de pujas</h5>
              <ul id="historialPujas" class="list-group"></ul>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toastContainer" style="position:fixed;right:20px;bottom:20px;z-index:2000"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@7.0.5/dist/browser/signalr.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/catalogo.js"></script>
  </body>
</html>
