<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/account.css">
</head>
<body>
    <main class="account-card">
        <h1>Recuperar contraseña</h1>
        <p>Ingresá tu correo y te enviaremos un enlace seguro.</p>

        <form id="forgotPasswordForm">
            <label for="email">Correo electrónico</label>
            <input id="email" class="form-control" type="email" required autocomplete="email">
            <div id="message" role="status"></div>
            <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
        </form>

        <a href="/pages/login.html">Volver a ingresar</a>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/recuperar-contrasena.js"></script>
</body>
</html>
