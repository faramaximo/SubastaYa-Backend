<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Publicar Artículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/catalogo.css"/>
    <link rel="stylesheet" href="/css/crear-subasta.css"/>
    <link rel="stylesheet" href="/css/auth.css"/>
</head>
<body>
    <div class="app-container">
        <!-- CABECERA -->
        <header class="market-header">
            <div class="market-header__top">
                <a class="market-logo" href="/index.html">SubastaYa</a>
                <nav class="market-nav" aria-label="Navegación principal">
                    <a href="/index.html">Explorar</a>
                    <a href="/pages/crear-subasta.html" class="active">Crear subasta</a>
                    <a href="/pages/billetera.html">Billetera</a>
                    <a href="/pages/panel.html">Mis actividades</a>
                </nav>
                <div class="header-controls">
                    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
                        <span class="theme-toggle__icon" aria-hidden="true"></span>
                        <span class="theme-toggle__label">Oscuro</span>
                    </button>
                    <div class="auth-actions" aria-label="Acciones de cuenta"></div>
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="mb-4">
                <h1 class="page-header-title">Publicar un Artículo</h1>
                <p class="page-header-subtitle">Completá los datos para iniciar tu subasta</p>
            </div>

            <!-- Alertas de Error/Éxito -->
            <div id="alertaFormulario" class="alert d-none shadow-sm rounded-3 fw-medium" role="alert"></div>

            <!-- Contenedor del Formulario -->
            <div class="crear-subasta-container">
                <form id="formCrearSubasta" novalidate="">

                    <!-- SECCIÓN 1: INFO PRINCIPAL -->
                    <h2 class="section-title">Información del Producto</h2>
                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label-field">Título de la Subasta *</label>
                            <input type="text" class="form-control" id="titulo" placeholder="Ej: PlayStation 5 casi nueva" required />
                        </div>
                        <div class="col-md-6">
                            <label for="categoriaId" class="form-label-field">Categoría *</label>
                            <select class="form-select" id="categoriaId" required>
                                <option value="" disabled selected>Seleccioná una categoría...</option>
                                <option value="1">Tecnología</option>
                                <option value="2">Coleccionables</option>
                                <option value="3">Indumentaria</option>
                                <option value="4">Vehículos</option>
                            </select>
                        </div>

                        <!-- Descripción -->
                        <div class="col-12">
                            <label for="descripcion" class="form-label-field">Descripción del Artículo *</label>
                            <textarea class="form-control" id="descripcion" rows="4"
                                      placeholder="Describe el estado, características y detalles del artículo..." required></textarea>
                        </div>

                        <div class="col-12">
                            <label for="urlImagen" class="form-label-field">Enlace a la Imagen (URL) *</label>
                            <input type="url" class="form-control" id="urlImagen" placeholder="https://ejemplo.com/imagen.jpg" required />
                        </div>

                        <!-- PREVIEW (Oculto por defecto) -->
                        <div class="col-12 mt-3 d-none text-center" id="previewImagen">
                            <div class="preview-box">
                                <label class="form-label-field text-muted mb-3">Vista previa de la imagen</label>
                                <img id="imagenPreview" src="" alt="Vista previa" class="preview-image">
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: ECONOMÍA -->
                    <h2 class="section-title">Configuración Económica</h2>
                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <label for="precioBase" class="form-label-field">Precio Base Inicial ($) *</label>
                            <div class="input-group">
                                <span class="input-group-text input-group-currency">$</span>
                                <input type="number" class="form-control input-currency" id="precioBase" min="1" step="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="incrementoMinimo" class="form-label-field">Incremento Mínimo por Puja ($) *</label>
                            <div class="input-group">
                                <span class="input-group-text input-group-currency">$</span>
                                <input type="number" class="form-control input-currency" id="incrementoMinimo" min="1" step="0.01" required>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: TIEMPOS -->
                    <h2 class="section-title">Ventana Temporal</h2>
                    <fieldset class="row g-4 mb-5">
                        <legend class="visually-hidden">Fecha y horario de la subasta</legend>
                        <div class="col-md-6">
                            <div class="datetime-picker">
                                <label class="form-label-field mb-3" for="fechaInicio">Inicio *</label>
                                <div class="datetime-picker__fields">
                                    <div><label class="visually-hidden" for="fechaInicio">Fecha de inicio</label><input type="date" class="form-control" id="fechaInicio" required></div>
                                    <div><label class="visually-hidden" for="horaInicio">Hora de inicio</label><input type="time" class="form-control" id="horaInicio" step="900" required></div>
                                </div>
                                <div class="datetime-picker__quick-actions"><button type="button" data-schedule="start-now">Empezar en 15 min</button></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="datetime-picker">
                                <label class="form-label-field mb-3" for="fechaFin">Cierre *</label>
                                <div class="datetime-picker__fields">
                                    <div><label class="visually-hidden" for="fechaFin">Fecha de cierre</label><input type="date" class="form-control" id="fechaFin" required></div>
                                    <div><label class="visually-hidden" for="horaFin">Hora de cierre</label><input type="time" class="form-control" id="horaFin" step="900" required></div>
                                </div>
                                <div class="datetime-picker__quick-actions"><button type="button" data-schedule="end-hour">Finalizar 1 hora después</button></div>
                            </div>
                        </div>
                    </fieldset>

                    <!-- BOTÓN SUBMIT -->
                    <div class="form-actions-bar">
                        <button type="submit" class="btn-crear" id="btnPublicar">
                            Publicar Subasta Ahora
                        </button>
                    </div>

                </form>
            </div>
        </main>

        <footer class="market-footer">
            <p>© 2026 SubastaYa · Plataforma de Subastas en Tiempo Real</p>
        </footer>
    </div>

    <!-- Scripts de Bootstrap y aplicación -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/crear-subasta.js"></script>
</body>
</html>
