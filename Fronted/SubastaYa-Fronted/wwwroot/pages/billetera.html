<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>SubastaYa - Billetera Virtual</title>
		<!-- Bootstrap CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
		<!-- Estilos específicos -->
		<link rel="stylesheet" href="/css/catalogo.css"/>
		<link rel="stylesheet" href="/css/billetera.css"/>
	</head>
	<body>
		<div class="app-container">
			<!-- // QUÉ HACE: reemplaza el menú lateral por navegación superior. -->
			<!-- // POR QUÉ: mantiene disponible la cuenta sin reducir el espacio de la billetera. -->
			<header class="market-header">
				<div class="market-header__top">
					<a class="market-logo" href="/index.html">SubastaYa</a>
					<nav class="market-nav" aria-label="Navegación principal">
						<a href="/index.html">Explorar</a><a href="/pages/crear-subasta.html">Crear subasta</a><a href="/pages/billetera.html" class="active">Billetera</a><a href="/pages/panel.html">Mis actividades</a>
					</nav>
					<div class="header-controls"><button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false"><span class="theme-toggle__icon" aria-hidden="true"></span><span class="theme-toggle__label">Oscuro</span></button><div class="auth-actions" aria-label="Acciones de cuenta"></div></div>
				</div>
			</header>
			<!-- CONTENIDO PRINCIPAL DE LA BILLETERA -->
			<main class="main-content">
				<section id="wallet-view" class="view-section">
					<div class="wallet-container">
						<h2 class="fw-bold mb-3">Billetera Virtual</h2>

						<!-- Tarjetas de Saldos -->
						<div class="wallet-grid-cards">
							<div class="wallet-card">
								<span class="wallet-card-title">Saldo Total</span>
								<div id="saldo-total" class="wallet-card-amount amount-total">$0.00</div>
							</div>
							<div class="wallet-card">
								<span class="wallet-card-title">Saldo Retenido (Pujas Activas)</span>
								<div id="saldo-retenido" class="wallet-card-amount amount-retenido">$0.00</div>
							</div>
							<div class="wallet-card">
								<span class="wallet-card-title">Saldo Disponible</span>
								<div id="saldo-disponible" class="wallet-card-amount amount-disponible">$0.00</div>
							</div>
						</div>

						<!-- Formulario e Historial -->
						<div class="wallet-content-layout">
							<div class="wallet-panel">
								<h4 class="fw-bold mb-3">Cargar Saldo Simulado</h4>
								<form id="deposit-form">
									<div class="wallet-form-group">
										<label for="deposit-amount">Monto a ingresar ($)</label>
										<input type="number" id="deposit-amount" class="wallet-input" min="100" step="100" placeholder="Ej: 5000" required="">
									</div>
									<button type="submit" class="btn-primary">Ingresar Dinero</button>
								</form>
								<div id="deposit-message" style="margin-top: 12px; font-size: 0.875rem;"></div>
							</div>

							<div class="wallet-panel">
								<h4 class="fw-bold mb-3">Historial de Transacciones (Ledger)</h4>
								<div style="overflow-x: auto;">
									<table class="ledger-table">
										<thead>
											<tr>
												<th>ID</th>
												<th>Tipo</th>
												<th>Monto</th>
												<th>Fecha</th>
											</tr>
										</thead>
										<tbody id="ledger-table-body">
											<tr>
												<td colspan="4" style="text-align: center; color: #a1a5b7;">Cargando historial...</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</section>
			</main>
		</div>

		<!-- Scripts JS al final del body -->
		<script src="/js/config.js"></script>
		<script src="/js/auth.js"></script>
		<script src="/js/wallet.js"></script>
	</body>
</html>
