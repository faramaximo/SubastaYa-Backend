<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/auth.css"/>
</head>
<body>
    <main class="login-card text-center">
        <h2 class="fw-bold mb-1">SubastaYa</h2>
        <p class="text-muted mb-4">Unite a la plataforma</p>

        <form id="formRegistro">
            <div class="text-start mb-3">
                <label for="nombre" class="form-label-custom">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" required placeholder="Ej: Juan Pérez" autocomplete="name">
            </div>
            <div class="text-start mb-3">
                <label for="email" class="form-label-custom">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="ejemplo@correo.com" autocomplete="email">
            </div>
            <div class="text-start mb-4">
                <label for="password" class="form-label-custom">Contraseña</label>
                <input type="password" class="form-control" id="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <div id="registroMensaje" class="alert auth-alert d-none" role="alert"></div>

            <button type="submit" class="btn-login" id="btnSubmit">Crear Cuenta</button>
        </form>

        <div class="auth-card-footer">
            <p class="text-muted mb-0">
                ¿Ya tenés cuenta?
                <a href="/pages/login.html" class="auth-link-secondary fw-bold">
                    Iniciá sesión
                </a>
            </p>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/registro.js"></script>
</body>
</html>
