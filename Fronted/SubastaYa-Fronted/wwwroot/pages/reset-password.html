<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SubastaYa - Nueva contraseña</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/account.css"></head>
<body><main class="account-card"><h1>Elegí una nueva contraseña</h1><p>Usá al menos 12 caracteres.</p><form id="resetPasswordForm"><label for="password">Nueva contraseña</label><input id="password" class="form-control" type="password" required minlength="12" autocomplete="new-password"><label for="confirmPassword">Repetí la contraseña</label><input id="confirmPassword" class="form-control" type="password" required minlength="12" autocomplete="new-password"><div id="message" role="status"></div><button class="btn btn-primary w-100" type="submit">Actualizar contraseña</button></form><a href="/pages/login.html">Volver a ingresar</a></main><script src="/js/config.js"></script><script src="/js/reset-password.js"></script></body></html>
