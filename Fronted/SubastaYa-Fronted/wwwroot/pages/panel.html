<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Mis Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/catalogo.css"/>
    <link rel="stylesheet" href="/css/panel.css"/>
    <link rel="stylesheet" href="/css/auth.css"/>
</head>
<body>
    <div class="app-container">
        <!-- CABECERA -->
        <header class="market-header">
            <div class="market-header__top">
                <a class="market-logo" href="/index.html">SubastaYa</a>
                <nav class="market-nav" aria-label="Navegación principal">
                    <a href="/index.html">Explorar</a>
                    <a href="/pages/crear-subasta.html">Crear subasta</a>
                    <a href="/pages/billetera.html">Billetera</a>
                    <a href="/pages/panel.html" class="active">Mis actividades</a>
                </nav>
                <div class="header-controls">
                    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
                        <span class="theme-toggle__icon" aria-hidden="true"></span>
                        <span class="theme-toggle__label">Oscuro</span>
                    </button>
                    <div class="auth-actions" aria-label="Acciones de cuenta"></div>
                </div>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="mb-4">
                <h1 class="panel-title">Mis Actividades</h1>
                <p class="panel-subtitle mb-0">Gestioná tus compras y publicaciones</p>
            </div>

            <!-- Pestañas -->
            <ul class="nav nav-tabs mb-4" id="panelTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="compras-tab" data-bs-toggle="tab" data-bs-target="#compras" type="button" role="tab">Mis Compras / Pujas</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="ventas-tab" data-bs-toggle="tab" data-bs-target="#ventas" type="button" role="tab">Mis Publicaciones</button>
                </li>
            </ul>

            <!-- Contenido de las Pestañas -->
            <div class="tab-content" id="panelTabsContent">
                <!-- PESTAÑA: MIS COMPRAS / PUJAS -->
                <div class="tab-pane fade show active" id="compras" role="tabpanel">
                    <div id="contenedorCompras" class="d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">Cargando tus pujas...</div>
                    </div>
                </div>

                <!-- PESTAÑA: MIS PUBLICACIONES -->
                <div class="tab-pane fade" id="ventas" role="tabpanel">
                    <div id="contenedorVentas" class="d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">Cargando tus publicaciones...</div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="market-footer">
            <p>© 2026 SubastaYa · Plataforma de Subastas en Tiempo Real</p>
        </footer>
    </div>

    <!-- Scripts de Bootstrap y aplicación -->
    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/panel.js"></script>
</body>
</html>
