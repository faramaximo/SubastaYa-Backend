<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #0f111a; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .login-card { background-color: #16192b; border: 1px solid #2a2f4c; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .form-control { background-color: #1e2238; border: 1px solid #2a2f4c; color: white; padding: 15px; border-radius: 12px; }
        .form-control:focus { border-color: #6c5ce7; box-shadow: none; background-color: #1e2238; color: white;}
        .btn-login { background: linear-gradient(135deg, #6c5ce7 0%, #8e7dff 100%); color: white; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; border: none; margin-top: 10px; transition: all 0.3s;}
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="fw-bold mb-1">SubastaYa</h2>
        <p class="text-muted mb-4">Ingresá a tu cuenta</p>

        <form id="formLogin">
            <div class="text-start mb-3">
                <label class="mb-2 text-white-50 fw-bold" style="font-size: 0.85rem;">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="ejemplo@test.com">
            </div>
            <div class="text-start mb-4">
                <label class="mb-2 text-white-50 fw-bold" style="font-size: 0.85rem;">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
            </div>

            <div id="loginError" class="alert alert-danger d-none" style="font-size: 0.85rem; padding: 10px; border-radius: 10px;"></div>

            <button type="submit" class="btn-login" id="btnSubmit">Ingresar al Sistema</button>
            <a href="/pages/recuperar-contrasena.html" class="text-decoration-none d-inline-block mt-3" style="color: #a29bfe; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
        </form>
        <div class="mt-4 pt-3 border-top" style="border-color: #2a2f4c !important;">
            <p class="text-muted mb-3" style="font-size: 0.9rem;">
                ¿No tenés cuenta?
                <!-- Dejamos el href="#" por ahora para no salirnos del alcance del TP -->
                <a href="/pages/registro.html" class="text-decoration-none fw-bold" style="color: #a29bfe; transition: 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#a29bfe'">
                    Registrate acá
                </a>
            </p>

            <a href="/index.html" class="text-white-50 text-decoration-none fw-bold d-inline-block mt-1" style="font-size: 0.85rem; transition: 0.2s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color=''">
                ← Explorar catálogo como invitado
            </a>
        </div>




    </div>

    <script src="/js/config.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
