<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/auth.css"/>
    <script>
        // Si se accede directamente, redirigir al catálogo con la ventana flotante abierta sobre la página
        window.location.replace("/index.html?action=login");
    </script>
</head>
<body class="auth-page">
    <main class="login-card text-center">
        <h2 class="fw-bold mb-1">SubastaYa</h2>
        <p class="text-muted mb-4">Ingresá a tu cuenta</p>

        <form id="formLogin">
            <div class="text-start mb-3">
                <label for="email" class="form-label-custom">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="ejemplo@test.com" autocomplete="email">
            </div>
            <div class="text-start mb-4">
                <label for="password" class="form-label-custom">Contraseña</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <div id="loginError" class="alert alert-danger auth-alert d-none" role="alert"></div>

            <button type="submit" class="btn-login" id="btnSubmit">Ingresar al Sistema</button>
            <a href="/pages/recuperar-contrasena.html" class="auth-link-secondary mt-3">¿Olvidaste tu contraseña?</a>
        </form>

        <div class="auth-card-footer">
            <p class="text-muted mb-3">
                ¿No tenés cuenta?
                <a href="/pages/registro.html" class="auth-link-secondary fw-bold">
                    Registrate acá
                </a>
            </p>

            <a href="/index.html" class="auth-guest-link">
                ← Explorar catálogo como invitado
            </a>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
