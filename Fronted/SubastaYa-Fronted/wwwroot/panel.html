<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SubastaYa - Panel de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/catalogo.css"/>
    <style>
        .nav-tabs { border-bottom: 2px solid var(--border-color); border-radius: 0; }
        .nav-tabs .nav-link { color: var(--text-muted); font-weight: 600; border: none; padding: 15px 25px; border-bottom: 3px solid transparent; background: transparent; transition: all 0.2s;}
        .nav-tabs .nav-link:hover { color: var(--text-principal); border-bottom: 3px solid var(--border-color); }
        .nav-tabs .nav-link.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); background: transparent;}
        .panel-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; }
        .panel-img { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; }
        .badge-estado { padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 0.8rem;}
    </style>
</head>
<body>
    <div class="app-container">
        <!-- // QUÉ HACE: concentra navegación y acciones de cuenta arriba. -->
        <!-- // POR QUÉ: el panel conserva todo el ancho útil de la pantalla. -->
		<header class="market-header">
			<div class="market-header__top">
				<a class="market-logo" href="/index.html">SubastaYa</a>
				<nav class="market-nav" aria-label="Navegación principal">
					<a href="/index.html">Explorar</a><a href="/crear-subasta.html">Crear subasta</a><a href="/billetera.html">Billetera</a><a href="/panel.html" class="active">Mis actividades</a>
				</nav>
				<div class="header-controls"><button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false"><span class="theme-toggle__icon" aria-hidden="true"></span><span class="theme-toggle__label">Oscuro</span></button><div class="auth-actions" aria-label="Acciones de cuenta"></div></div>
			</div>
		</header>
        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="mb-4">
                <h3 class="fw-bold m-0 text-white" style="font-size: 2rem;">Mis Actividades</h3>
                <p class="text-white-50">Gestioná tus compras y publicaciones</p>
            </div>

            <!-- Pestañas -->
            <ul class="nav nav-tabs mb-4" id="panelTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="compras-tab" data-bs-toggle="tab" data-bs-target="#compras" type="button" role="tab">Mis Compras / Pujas</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="ventas-tab" data-bs-toggle="tab" data-bs-target="#ventas" type="button" role="tab">Mis Publicaciones</button>
                </li>
            </ul>

            <!-- Contenido de las Pestañas -->
            <div class="tab-content" id="panelTabsContent">

                <!-- PESTAÑA: MIS COMPRAS / PUJAS -->
                <div class="tab-pane fade show active" id="compras" role="tabpanel">
                    <div id="contenedorCompras" class="d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">Cargando tus pujas...</div>
                    </div>
                </div>

                <!-- PESTAÑA: MIS PUBLICACIONES -->
                <div class="tab-pane fade" id="ventas" role="tabpanel">
                    <div id="contenedorVentas" class="d-flex flex-column gap-3">
                        <div class="text-center text-muted py-5">Cargando tus publicaciones...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts de Bootstrap (Necesarios para que funcionen las pestañas) y los tuyos -->
    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/panel.js"></script>
</body>
</html>
