<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SubastaYa - Perfil</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/catalogo.css"></head>
<body><div class="app-container"><header class="market-header"><div class="market-header__top"><a class="market-logo" href="/index.html">SubastaYa</a><nav class="market-nav" aria-label="Navegación principal"><a href="/index.html">Explorar</a><a href="/crear-subasta.html">Crear subasta</a><a href="/billetera.html">Billetera</a><a href="/panel.html">Mis actividades</a></nav><div class="header-controls"><button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false"><span class="theme-toggle__label">Oscuro</span></button><div class="auth-actions" aria-label="Acciones de cuenta"></div></div></div></header>
<main class="main-content profile-page"><div class="profile-page__heading"><h1>Perfil</h1><p>Gestioná cómo te ven compradores y vendedores.</p></div><div class="profile-grid"><section class="profile-card"><h2>Datos personales</h2><form id="profileForm" class="profile-form"><label for="profileName">Nombre visible</label><input id="profileName" class="form-control" required maxlength="80"><label for="profileEmail">Correo electrónico</label><input id="profileEmail" class="form-control" type="email" required><label for="profileBio">Acerca de vos</label><textarea id="profileBio" class="form-control" rows="4" maxlength="280"></textarea><div id="profileMessage" class="profile-message" role="status"></div><button class="btn btn-primary" type="submit">Guardar cambios</button></form></section><section class="profile-card" id="configuracion"><h2>Configuración</h2><form id="settingsForm" class="profile-form"><label class="settings-option"><input id="emailNotifications" type="checkbox"> Recibir avisos por correo sobre pujas y ventas</label><label class="settings-option"><input id="publicProfile" type="checkbox" checked> Mostrar mi perfil a otros usuarios</label><div id="settingsMessage" class="profile-message" role="status"></div><button class="btn btn-outline-secondary" type="submit">Guardar configuración</button></form></section></div><section class="profile-card reviews-card"><div class="reviews-card__heading"><div><h2>Opiniones y reseñas</h2><p>Tu reputación como comprador y vendedor.</p></div><div id="reviewSummary" class="review-summary" aria-live="polite"></div></div><div class="review-tabs" role="tablist"><button class="review-tab active" type="button" data-role="comprador" role="tab" aria-selected="true">Como comprador</button><button class="review-tab" type="button" data-role="vendedor" role="tab" aria-selected="false">Como vendedor</button></div><div id="reviewsList" class="reviews-list"></div></section></main></div><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/perfil.js"></script></body></html>
