<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>SubastaYa - Crear Subasta</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
		<link rel="stylesheet" href="/css/catalogo.css"/>

		<!-- ESTILOS PREMIUM EXCLUSIVOS PARA EL FORMULARIO -->
		<style>
			/* Inputs mejorados: más altos, bordes suaves y color de foco personalizado */
			.form-control, .form-select {
			background-color: var(--bg-input) !important;
			border: 1px solid var(--border-color) !important;
			color: #ffffff !important;
			padding: 14px 18px;
			border-radius: 12px;
			transition: all 0.3s ease;
			font-size: 0.95rem;
			}

			.form-control:focus, .form-select:focus {
			background-color: #16192b !important;
			border-color: var(--accent-purple) !important;
			box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2) !important;
			}

			.form-control::placeholder {
			color: #626a8a !important;
			font-weight: 400;
			}

			.form-select option {
			background-color: var(--bg-input);
			color: #ffffff;
			}

			/* Títulos de sección */
			.section-title {
			font-size: 1.1rem;
			font-weight: 700;
			color: #a29bfe; /* Violeta claro */
			margin-bottom: 20px;
			display: flex;
			align-items: center;
			gap: 8px;
			border-bottom: 1px solid var(--border-color);
			padding-bottom: 10px;
			}

			/* Botón principal */
			.btn-crear {
			background: linear-gradient(135deg, #6c5ce7 0%, #8e7dff 100%);
			border: none;
			color: white;
			padding: 16px 30px;
			font-size: 1.1rem;
			border-radius: 14px;
			box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
			transition: all 0.3s ease;
			}

			.btn-crear:hover {
			transform: translateY(-3px);
			box-shadow: 0 8px 25px rgba(108, 92, 231, 0.5);
			color: white;
			}

			.btn-crear:disabled {
			background: #4a4d65;
			transform: none;
			box-shadow: none;
			}
		</style>
	</head>
	<body>
		<div class="app-container">
			<!-- BARRA LATERAL -->
			<aside class="sidebar">
				<div class="sidebar-brand mb-4">
					<h2>SubastaYa</h2>
				</div>

				<nav class="sidebar-nav d-flex flex-column">
					<!-- Agregamos bordes inferiores sutiles y padding a cada opción -->
					<a href="/index.html" class="text-decoration-none border-bottom border-secondary border-opacity-25 pb-3 mb-3">
						Explorar Catálogo
					</a>
					<a href="/billetera.html" class="text-decoration-none border-bottom border-secondary border-opacity-25 pb-3 mb-3">
						Billetera Virtual
					</a>
					<a href="/index.html#wallet" class="text-decoration-none border-bottom border-secondary border-opacity-25 pb-3 mb-3">
						Billetera Virtual
				
					</a>
					<!-- La activa no necesita borde abajo porque es la última del bloque principal -->
					<a href="/panel.html" class="text-decoration-none pb-3 mb-3">
						Mis Actividades
					</a>
				</nav>

				<!-- Agregamos un margen automático top (mt-auto) para empujar esto bien abajo -->
				<div class="sidebar-bottom mt-auto">
					<!-- 👇 Le damos contraste a configuración con text-white-50 👇 -->
					<a href="#" class="text-white-50 text-decoration-none d-block mb-3">
						Configuración
					</a>
					<a href="#" id="btnCerrarSesion" class="text-danger fw-bold text-decoration-none d-block">
						Cerrar sesión
					</a>
				</div>
			</aside>

			<!-- CONTENIDO PRINCIPAL -->
			<main class="main-content">
				<div class="mb-4">
					<h3 class="fw-bold m-0 text-white" style="font-size: 2rem;">Publicar un Artículo</h3>
					<p class="mt-1 mb-0" style="color: #a2a5b9;">Completá los datos para iniciar tu subasta</p>
				</div>

				<!-- Alertas de Error/Éxito -->
				<div id="alertaFormulario" class="alert d-none shadow-sm" role="alert" style="border-radius: 12px; font-weight: 500;"></div>

				<!-- Contenedor del Formulario -->
				<div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 40px; max-width: 900px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
					<form id="formCrearSubasta" novalidate="">

						<!-- SECCIÓN 1: INFO PRINCIPAL -->
						<h4 class="section-title">Información del Producto</h4>
						<div class="row g-4 mb-5">
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Título de la Subasta *</label>
								<input type="text" class="form-control" id="titulo" placeholder="Ej: PlayStation 5 casi nueva" required=""/>
							</div>
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Categoría *</label>
								<select class="form-select" id="categoriaId" required="">
									<option value="" disabled="" selected="">Seleccioná una categoría...</option>
									<option value="1">Tecnología</option>
									<option value="2">Coleccionables</option>
									<option value="3">Arte</option>
									<option value="4">Vehículos</option>
								</select>
							</div>

							<!-- Descripción -->
							<div class="col-12">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Descripción del Artículo *</label>
								<textarea class="form-control" id="descripcion" rows="4"
										  placeholder="Describe el estado, características y detalles del artículo..." required=""></textarea>
							</div>

							<div class="col-12">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Enlace a la Imagen (URL) *</label>
								<input type="url" class="form-control" id="urlImagen" placeholder="https://ejemplo.com/imagen.jpg" required=""/>
							</div>

							<!-- PREVIEW (Oculto por defecto) -->
							<div class="col-12 mt-3 d-none text-center" id="previewImagen">
								<div style="padding: 15px; background-color: var(--bg-input); border-radius: 16px; border: 1px dashed var(--border-color);">
									<label class="text-muted mb-3 fw-bold d-block" style="font-size: 0.85rem;">Vista previa de la imagen</label>
									<img id="imagenPreview" src="" alt="Vista previa" style="max-width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                            </div>
							</div>
						</div>

						<!-- SECCIÓN 2: ECONOMÍA -->
						<h4 class="section-title">Configuración Económica</h4>
						<div class="row g-4 mb-5">
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Precio Base Inicial ($) *</label>
								<div class="input-group">
									<span class="input-group-text" style="background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); border-right: none;">$</span>
									<input type="number" class="form-control" id="precioBase" min="1" step="0.01" style="border-left: none;" required="">
                            </div>
							</div>
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Incremento Mínimo por Puja ($) *</label>
								<div class="input-group">
									<span class="input-group-text" style="background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted); border-right: none;">$</span>
									<input type="number" class="form-control" id="incrementoMinimo" min="1" step="0.01" style="border-left: none;" required="">
                            </div>
							</div>
						</div>

						<!-- SECCIÓN 3: TIEMPOS -->
						<h4 class="section-title">Ventana Temporal</h4>
						<div class="row g-4 mb-5">
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Fecha y Hora de Inicio *</label>
								<input type="datetime-local" class="form-control" id="fechaInicio" required="">
                        </div>
							<div class="col-md-6">
								<label class="mb-2 text-white fw-bold" style="font-size: 0.85rem;">Fecha y Hora de Cierre *</label>
								<input type="datetime-local" class="form-control" id="fechaFin" required="">
                        </div>
						</div>

						<!-- Botón de Envío -->
			
						<div class="col-12 text-end border-top pt-4" style="border-color: var(--border-color) !important;">
							<button type="button" class="btn btn-link text-white-50 text-decoration-none me-3 fw-bold"
									onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color=''"
									onclick="document.getElementById('formCrearSubasta').reset(); document.getElementById('previewImagen').classList.add('d-none');">
								Limpiar
							</button>
							<button type="submit" class="btn btn-crear fw-bold" id="btnSubmit">
								Publicar Subasta
							</button>
						</div>

					</form>
				</div>
			</main>
		</div>
		<script src="/js/crear-subasta.js"></script>
		<script src="/js/auth.js"></script>
	
	</body>
</html>
